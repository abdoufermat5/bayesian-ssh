[workspace]
members = [
    "crates/ai-jail",
    "crates/cli",
    "crates/gui",
    "crates/teams-proto",
]
default-members = ["crates/cli"]
resolver = "2"

[profile.release]
opt-level = 3          # Maximum optimization
lto = "thin"           # Link-time optimization
strip = "symbols"      # Strip debug symbols
panic = "abort"        # Abort on panic (smaller binary)
debug = false          # No debug info
