name: Release

# Push a tag like v2.6.0 to build, sign and publish a release. Every optional
# channel turns on with its own secret; see docs/src/reference/distribution.md.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.6.0). Must already exist on the branch.'
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BIN_NAME: bayesian-ssh

jobs:
  # ── 0 ▸ Resolve the tag and the updater signing configuration ──────────────
  gate:
    name: Release gate
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      updater_enabled: ${{ steps.updater.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify tag matches app versions
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          tag="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          version="${tag#v}"
          case "$version" in
            ''|*[!0-9A-Za-z.+-]*) echo "::error::invalid release tag: $tag"; exit 1 ;;
          esac
          cli="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/cli/Cargo.toml | head -1)"
          gui="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/gui/Cargo.toml | head -1)"
          tauri="$(jq -r .version crates/gui/tauri.conf.json)"
          npm="$(jq -r .version desktop/package.json)"
          for v in "$cli" "$gui" "$tauri" "$npm"; do
            if [ "$v" != "$version" ]; then
              echo "::error::Version mismatch: tag=$version cli=$cli gui=$gui tauri.conf.json=$tauri package.json=$npm"
              exit 1
            fi
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # Updater signing is all-or-nothing: a signing key without the matching
      # public key would publish artifacts that installed apps can never verify.
      # Secrets are only compared, never printed.
      - name: Resolve updater signing configuration
        id: updater
        shell: bash
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.BAYESIAN_SSH_UPDATER_PUBLIC_KEY }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ -n "$UPDATER_PUBLIC_KEY" ]; then has_public=true; else has_public=false; fi
          if [ "$HAS_SIGNING_KEY" != "$has_public" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY and variable BAYESIAN_SSH_UPDATER_PUBLIC_KEY must be set together (or both left empty to publish without in-app updates)."
            exit 1
          fi
          case "$UPDATER_PUBLIC_KEY" in
            *$'\n'*|*$'\r'*)
              echo "::error::BAYESIAN_SSH_UPDATER_PUBLIC_KEY must be a single line (the base64 public key content)."
              exit 1
              ;;
          esac
          echo "enabled=$has_public" >> "$GITHUB_OUTPUT"
          if [ "$has_public" = "false" ]; then
            echo "::notice::Updater keys not configured; publishing without signed updater artifacts or latest.json."
          fi

  # ── 1 ▸ Build one set of binaries and bundles per architecture ─────────────
  build:
    name: Build ${{ matrix.os_name }}-${{ matrix.arch }}
    needs: gate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned to 24.04: the snap base (core24) must ship the glibc these
        # binaries were linked against.
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      # The restored cache may carry bundles from a previous version; staging
      # picks bundles with `find | head`, so start clean.
      - name: Remove stale bundles from restored cache
        run: rm -rf "target/${{ matrix.target }}/release/bundle"

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils

      - name: Build release binary
        run: cargo build --release --locked --package bayesian-ssh --target ${{ matrix.target }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: cd desktop && npm ci --legacy-peer-deps

      # Only when both updater keys are configured (validated by the gate):
      # embed the public key at compile time and have the bundler sign the
      # .AppImage/.deb/.rpm. The bundler refuses createUpdaterArtifacts without
      # a `plugins.updater` section, so the same key and endpoint go there.
      # Only the public variable is written here.
      - name: Configure updater artifacts
        shell: bash
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.BAYESIAN_SSH_UPDATER_PUBLIC_KEY }}
          UPDATER_ENABLED: ${{ needs.gate.outputs.updater_enabled }}
          CONFIG: ${{ runner.temp }}/tauri.release.conf.json
        run: |
          if [ "$UPDATER_ENABLED" = "true" ]; then
            echo "BAYESIAN_SSH_UPDATER_PUBLIC_KEY=$UPDATER_PUBLIC_KEY" >> "$GITHUB_ENV"
            jq -n --arg key "$UPDATER_PUBLIC_KEY" \
              --arg endpoint "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json" \
              '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $key, endpoints: [$endpoint]}}}' > "$CONFIG"
          else
            echo '{}' > "$CONFIG"
          fi

      - name: Build desktop release bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd desktop
          npm run tauri build -- --target ${{ matrix.target }} --config "${{ runner.temp }}/tauri.release.conf.json"

      - name: Stage artifacts
        id: stage
        shell: bash
        env:
          UPDATER_ENABLED: ${{ needs.gate.outputs.updater_enabled }}
        run: |
          mkdir -p dist
          ASSET="${BIN_NAME}-${{ matrix.os_name }}-${{ matrix.arch }}"
          RELEASE_DIR="target/${{ matrix.target }}/release"

          # CLI binary
          cp "${RELEASE_DIR}/${BIN_NAME}" "dist/${ASSET}"
          chmod +x "dist/${ASSET}"
          tar -C dist -czf "dist/${ASSET}.tar.gz" "${ASSET}"

          # Desktop binary. Bundles carry their own stamped copy; this one has
          # no bundle type, so it never offers in-app updates.
          DESKTOP_ASSET="bayesian-ssh-desktop-${{ matrix.os_name }}-${{ matrix.arch }}"
          cp "${RELEASE_DIR}/bayesian-ssh-gui" "dist/${DESKTOP_ASSET}"
          chmod +x "dist/${DESKTOP_ASSET}"
          tar -C dist -czf "dist/${DESKTOP_ASSET}.tar.gz" "${DESKTOP_ASSET}"

          # Desktop bundles, plus their updater signatures when enabled.
          for ext in deb rpm AppImage; do
            file="$(find "${RELEASE_DIR}/bundle" -type f -name "*.${ext}" | head -n 1)"
            if [ -z "$file" ]; then
              echo "::error::no .${ext} bundle produced"
              exit 1
            fi
            cp "$file" "dist/${DESKTOP_ASSET}.${ext}"
            if [ "$UPDATER_ENABLED" = "true" ]; then
              if [ ! -f "${file}.sig" ]; then
                echo "::error::missing updater signature ${file}.sig"
                exit 1
              fi
              cp "${file}.sig" "dist/${DESKTOP_ASSET}.${ext}.sig"
            fi
          done

          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # ── 1b ▸ Unified CLI + desktop .deb/.rpm (amd64) ───────────────────────────
  packages:
    name: Build unified .deb & .rpm
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libayatana-appindicator3-dev librsvg2-dev xdg-utils

      - name: Build unified .deb and .rpm packages
        run: ./scripts/package.sh

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/packages/*.deb
            target/packages/*.rpm
          if-no-files-found: error
          retention-days: 7

  # ── 2 ▸ Sign and publish the GitHub release ────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [gate, build, packages]
    permissions:
      contents: write
      id-token: write      # Sigstore keyless signing
      attestations: write  # build provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( -name "${BIN_NAME}-*" -o -name "${BIN_NAME}_*.deb" \) -exec cp {} release/ \;
          ls -lh release

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          NOTES="$(mktemp)"
          if [ -f CHANGELOG.md ] && grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            awk -v ver="${VERSION}" '
              $0 ~ ("^## \\[" ver "\\]") { capture=1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md > "$NOTES"
          else
            echo "Release ${VERSION}." > "$NOTES"
          fi
          cp "$NOTES" changelog_notes.md
          {
            echo "## Bayesian SSH ${VERSION}"
            echo
            cat "$NOTES"
            echo
            echo "---"
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash"
            echo "# or"
            echo "sudo snap install bayesian-ssh"
            echo '```'
            echo
            echo "### Verify"
            echo
            echo '```bash'
            echo "cosign verify-blob --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github\.com/abdoufermat5/bayesian-ssh/\.github/workflows/release\.yml@refs/(tags/v.+|heads/main)\$' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS"
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo "gh attestation verify <file> --repo ${{ github.repository }}"
            echo '```'
          } > release_notes.md

      # Tauri updater manifest. `{os}-{arch}-{installer}` entries let each
      # installed bundle pick its own format; plain `{os}-{arch}` is the AppImage.
      - name: Generate updater manifest (latest.json)
        if: needs.gate.outputs.updater_enabled == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          TAG: ${{ needs.gate.outputs.tag }}
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          platforms='{}'
          for arch in x86_64 aarch64; do
            for pair in appimage:AppImage deb:deb rpm:rpm; do
              installer="${pair%%:*}"
              file="bayesian-ssh-desktop-linux-${arch}.${pair#*:}"
              [ -f "release/${file}.sig" ] || { echo "::error::missing release/${file}.sig"; exit 1; }
              entry="$(jq -n --arg url "${base}/${file}" --rawfile sig "release/${file}.sig" \
                '{url: $url, signature: ($sig | rtrimstr("\n"))}')"
              platforms="$(jq --arg k "linux-${arch}-${installer}" --argjson e "$entry" '. + {($k): $e}' <<<"$platforms")"
              if [ "$installer" = appimage ]; then
                platforms="$(jq --arg k "linux-${arch}" --argjson e "$entry" '. + {($k): $e}' <<<"$platforms")"
              fi
            done
          done
          jq -n --arg version "$VERSION" --rawfile notes changelog_notes.md \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' > release/latest.json
          jq '.platforms | keys' release/latest.json

      - name: Produce SHA256SUMS
        run: |
          cd release
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless: the signing identity is this workflow at this ref, recorded in
      # the Rekor transparency log. No key to store or rotate.
      - name: Sign SHA256SUMS
        run: |
          cd release
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          name: Bayesian SSH ${{ needs.gate.outputs.version }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ needs.gate.outputs.prerelease == 'true' }}
          files: release/*
          fail_on_unmatched_files: true

  # ── 3 ▸ Snap Store (amd64 + arm64), from the published assets ──────────────
  # Prereleases go to `candidate`; publishing is skipped with a notice when
  # SNAPCRAFT_STORE_CREDENTIALS is not configured.
  snap:
    name: Snap Store
    needs: [gate, release]
    uses: ./.github/workflows/snap.yml
    with:
      tag: ${{ needs.gate.outputs.tag }}
    secrets: inherit
