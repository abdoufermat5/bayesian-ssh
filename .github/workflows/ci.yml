name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

# One run per ref; superseded PR runs are cancelled, pushes to main are not.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PERIMETER.md guardrails: no private code, no secrets, only vetted crates.
  perimeter:
    name: Perimeter
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # gitleaks scans the whole history

    - name: No dependency on private code
      run: ./scripts/check-perimeter.sh

    - name: Install gitleaks
      run: |
        curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
        tar xzf gitleaks.tar.gz gitleaks
        sudo mv gitleaks /usr/local/bin/

    - name: Secret scan
      run: gitleaks git --no-banner --redact .

    - name: Licenses, advisories and sources
      uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      with:
        command: check advisories licenses bans sources

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Install system dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: desktop/package-lock.json

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --all -- --check

    # The GUI crate embeds desktop/build at compile time, so the frontend must
    # be built before any workspace-wide cargo command.
    - name: Build frontend
      run: |
        cd desktop
        npm ci --legacy-peer-deps
        npm run build

    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    - name: Run tests
      run: cargo test --workspace --locked

  test-desktop:
    name: Test Desktop
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: desktop/package-lock.json

    - name: Install frontend dependencies
      run: cd desktop && npm ci --legacy-peer-deps

    - name: Type-check frontend
      run: cd desktop && npm run check

    - name: Build frontend
      run: cd desktop && npm run build

    - name: Check design-token contrast
      run: cd desktop && npm run check:contrast

    - name: Install Playwright browser
      run: cd desktop && npx playwright install --with-deps chromium

    - name: End-to-end tests
      run: cd desktop && npm run e2e
      env:
        CI: true
