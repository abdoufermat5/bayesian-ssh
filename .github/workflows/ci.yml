name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

# One run per ref; superseded PR runs are cancelled, pushes to main are not.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Install system dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: desktop/package-lock.json

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt --all -- --check

    # The GUI crate embeds desktop/build at compile time, so the frontend must
    # be built before any workspace-wide cargo command.
    - name: Build frontend
      run: |
        cd desktop
        npm ci --legacy-peer-deps
        npm run build

    - name: Clippy
      run: cargo clippy --workspace --all-targets --locked -- -D warnings

    - name: Run tests
      run: cargo test --workspace --locked

  test-desktop:
    name: Test Desktop
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: desktop/package-lock.json

    - name: Install frontend dependencies
      run: cd desktop && npm ci --legacy-peer-deps

    - name: Type-check frontend
      run: cd desktop && npm run check

    - name: Build frontend
      run: cd desktop && npm run build

  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    needs: [test, test-desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Allow only one concurrent deployment to Pages
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install mdBook
      uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
      with:
        mdbook-version: 'latest'

    - name: Build documentation
      run: mdbook build

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: docs/book

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
