name: Snap

# Packages the assets published in an existing GitHub release (the CLI
# tarball and the desktop .deb) as a snap and, when credentials are
# configured, uploads it to the Snap Store.
#
# release.yml calls this after publishing a release. It can also be dispatched
# by hand to package an already-released version:
#
#   gh workflow run snap.yml -f tag=v2.6.0
#
# Publishing needs the SNAPCRAFT_STORE_CREDENTIALS secret. Without it the snap
# is still built and kept as a workflow artifact, and the publish step leaves a
# ::notice:: in the run summary. See docs/src/reference/distribution.md.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to package (e.g. v2.6.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (e.g. v2.6.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build snap (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # core24 matches the 24.04 release runners, so both arches are
        # supported.
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The staging script downloads the release assets, verifies them against
      # SHA256SUMS and renders the snapcraft.yaml version token, so tag and arch
      # are passed through the environment (never interpolated into the script).
      - name: Stage the snap project
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: scripts/snap-stage.sh "$TAG" "$ARCH" target/snap

      - uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: target/snap

      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.arch }}
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  publish:
    name: Publish to the Snap Store (${{ matrix.arch }})
    needs: [build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: arm64
            os: ubuntu-24.04-arm
    steps:
      # A job-level `if:` cannot read `secrets`, so resolve the boolean here.
      # Secrets are only compared, never printed.
      - name: Resolve store credentials
        id: creds
        shell: bash
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -n "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SNAPCRAFT_STORE_CREDENTIALS is not set; the snap was built but not published. Set the secret to publish (see docs/src/reference/distribution.md)."
          fi

      # Plain versions go to `stable`, prereleases (a '-' in the version) to
      # `candidate`.
      - name: Resolve release channel
        id: channel
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "${TAG#v}" in
            *-*) echo "channel=candidate" >> "$GITHUB_OUTPUT" ;;
            *) echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/download-artifact@v4
        if: steps.creds.outputs.configured == 'true'
        with:
          name: snap-${{ matrix.arch }}
          path: snap

      - name: Locate the snap artifact
        id: file
        if: steps.creds.outputs.configured == 'true'
        shell: bash
        run: |
          file="$(find snap -name '*.snap' -print -quit)"
          if [ -z "$file" ]; then
            echo "::error::no .snap artifact found"
            exit 1
          fi
          echo "snap=$file" >> "$GITHUB_OUTPUT"

      - uses: snapcore/action-publish@v1
        if: steps.creds.outputs.configured == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.file.outputs.snap }}
          release: ${{ steps.channel.outputs.channel }}
