[package]
name = "bayesian-ssh"
version = "2.5.2"
edition = "2021"
authors = ["Abdoufermat5"]
description = "A fast and lightweight SSH session manager with Kerberos support"
license = "MIT"
repository = "https://github.com/abdoufermat5/bayesian-ssh"

[lib]
name = "bayesian_ssh"
path = "src/lib.rs"

[[bin]]
name = "bayesian-ssh"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# CLI framework
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"

# Database
rusqlite = { version = "0.29", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Terminal and process management
nix = { version = "0.27", features = ["process", "signal"] }
pty = "0.2"
# Shared PTY primitives for GUI/TUI; already in the workspace lockfile via the GUI crate.
portable-pty = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Configuration
config = "0.13"
dirs = "5.0"
whoami = "1.5"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Async trait
async-trait = "0.1"

# Native SSH
russh = "0.44"
russh-sftp = "2.1"
russh-keys = "0.44"
rpassword = "7"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
rand = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"
toml = "1.0.3"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
