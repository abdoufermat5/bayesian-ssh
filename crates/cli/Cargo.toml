[package]
name = "bayesian-ssh"
version = "2.12.1"
edition = "2021"
authors = ["Abdoufermat5"]
description = "A fast and lightweight SSH session manager with Kerberos support"
license = "MIT"
repository = "https://github.com/abdoufermat5/bayesian-ssh"

[lib]
name = "bayesian_ssh"
path = "src/lib.rs"

[[bin]]
name = "bayesian-ssh"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# CLI framework
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"

# Database
rusqlite = { version = "0.29", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Terminal and process management
nix = { version = "0.27", features = ["process", "signal"] }
# Shared PTY primitives for the CLI and GUI.
portable-pty = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Configuration
dirs = "5.0"
whoami = "1.5"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Async trait
async-trait = "0.1"

# bssh Teams wire contract
bssh-teams-proto = { version = "0.1.0", path = "../teams-proto" }

# HTTPS client for bssh Teams. rustls-no-provider: the ring provider is already
# in the tree (see russh below); the default feature would pull aws-lc-sys.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
# Provider for reqwest above (installed once in TeamsClient::new).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Native SSH
# ring instead of the default aws-lc-rs: ring is already in the tree via rustls,
# and aws-lc-sys needs cmake + a C toolchain in every packaging build.
russh = { version = "0.64", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.1"
rpassword = "7"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
rand = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1.7", features = ["zeroize_derive"] }

crossterm = "0.28"
toml = "1.0.3"
tempfile = "3"

# Progress bars for transfer commands
indicatif = "0.17"
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
hkdf = "0.12"

# bssh AI (W4)
# MCP server. W8 adds "transport-streamable-http-server" for `bssh ai serve`.
rmcp = { version = "3.7.0", features = ["server", "macros", "transport-io", "elicitation"] }
schemars = "1"
diffy = "0.4"

[dev-dependencies]
# In-process MCP client for the round-trip tests.
rmcp = { version = "3.7.0", features = ["client", "server", "macros", "transport-io", "elicitation"] }
