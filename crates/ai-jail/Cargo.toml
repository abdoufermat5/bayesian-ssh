[package]
name = "bssh-ai-jail"
version = "0.1.0"
edition = "2021"
authors = ["Abdoufermat5"]
description = "Read-only Landlock jail for bssh AI: runs one command with no writes and no TCP"
license = "MIT"
repository = "https://github.com/abdoufermat5/bayesian-ssh"
publish = false

[[bin]]
name = "bssh-jail"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
landlock = "0.4"
