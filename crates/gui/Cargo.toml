[package]
name = "bayesian-ssh-gui"
version = "2.5.0"
edition = "2021"
authors = ["Abdoufermat5"]
description = "Bayesian SSH Desktop GUI Client"
license = "MIT"
repository = "https://github.com/abdoufermat5/bayesian-ssh"

[lib]
name = "bayesian_ssh_gui_lib"
path = "src/lib.rs"

[[bin]]
name = "bayesian-ssh-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bayesian-ssh = { path = "../cli" }
tokio = { version = "1.0", features = ["full"] }
portable-pty = "0.8"
futures = "0.3"
rfd = "0.14"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
