<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-search" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="cyan-blue-search" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bg-search)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#cyan-blue-search)" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Lens Circle -->
  <circle cx="27" cy="27" r="15" fill="#080e1e" stroke="url(#cyan-blue-search)" stroke-width="2.5"/>
  <!-- Handle -->
  <line x1="38" y1="38" x2="52" y2="52" stroke="url(#cyan-blue-search)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="41" y1="41" x2="49" y2="49" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>

  <!-- Bayesian Bell Curve inside Lens -->
  <path d="M 16 34 C 20 34, 23 32, 25 24 C 26 20, 26.5 17, 27 17 C 27.5 17, 28 20, 29 24 C 31 32, 34 34, 38 34" 
        fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <!-- Peak Mode Point (MAP) -->
  <circle cx="27" cy="17" r="2.5" fill="#ffffff"/>
  <!-- Focus crosshair point -->
  <circle cx="27" cy="27" r="1.2" fill="#94a3b8"/>
</svg>