<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Clean matte background -->
  <rect width="900" height="560" fill="#09090b"/>
  <rect x="0.5" y="0.5" width="899" height="559" fill="none" stroke="#27272a" stroke-width="1"/>

  <defs>
    <marker id="arrowBlue" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 1 1 L 6 3.5 L 1 6 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowMuted" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 1 1 L 6 3.5 L 1 6 Z" fill="#52525b"/>
    </marker>
  </defs>

  <!-- Header -->
  <g transform="translate(48, 36)">
    <text x="0" y="14" font-size="11" font-weight="600" fill="#71717a" class="mono" letter-spacing="0.15em">BAYESIAN SSH</text>
    <text x="0" y="38" font-size="20" font-weight="600" fill="#fafafa" class="sans">System Architecture</text>
    <text x="804" y="38" font-size="12" fill="#52525b" class="mono" text-anchor="end">4-Tier Modular Design</text>
  </g>

  <!-- 1. CLI & DESKTOP LAYER -->
  <g transform="translate(48, 90)">
    <rect width="804" height="82" rx="6" fill="#111113" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="22" font-size="11" font-weight="600" fill="#71717a" class="mono">01 / PRESENTATION LAYER</text>

    <g transform="translate(16, 34)" class="mono">
      <rect width="100" height="32" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="50" y="20" font-size="11" fill="#f4f4f5" text-anchor="middle">connect</text>

      <rect x="110" width="80" height="32" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="150" y="20" font-size="11" fill="#a1a1aa" text-anchor="middle">list</text>

      <rect x="200" width="90" height="32" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="245" y="20" font-size="11" fill="#a1a1aa" text-anchor="middle">history</text>

      <rect x="300" width="80" height="32" rx="4" fill="#18181b" stroke="#3b82f6" stroke-width="1"/>
      <text x="340" y="20" font-size="11" fill="#3b82f6" font-weight="bold" text-anchor="middle">tui</text>

      <rect x="390" width="80" height="32" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="430" y="20" font-size="11" fill="#a1a1aa" text-anchor="middle">alias</text>

      <rect x="480" width="292" height="32" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="626" y="20" font-size="11" fill="#f4f4f5" text-anchor="middle">Desktop GUI (Tauri / Svelte)</text>
    </g>
  </g>

  <!-- Vector Down -->
  <line x1="450" y1="172" x2="450" y2="198" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- 2. SERVICES & PROTOCOL ORCHESTRATION -->
  <g transform="translate(48, 200)">
    <rect width="570" height="88" rx="6" fill="#111113" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="22" font-size="11" font-weight="600" fill="#71717a" class="mono">02 / CORE SERVICES</text>

    <g transform="translate(16, 34)" class="mono">
      <rect width="125" height="36" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="62" y="22" font-size="11" fill="#f4f4f5" text-anchor="middle">SshService</text>

      <rect x="135" width="125" height="36" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="197" y="22" font-size="11" fill="#a1a1aa" text-anchor="middle">BastionRouter</text>

      <rect x="270" width="125" height="36" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="332" y="22" font-size="11" fill="#a1a1aa" text-anchor="middle">KerberosAuth</text>

      <rect x="405" width="133" height="36" rx="4" fill="#18181b" stroke="#3b82f6" stroke-width="1"/>
      <text x="471" y="22" font-size="11" fill="#3b82f6" font-weight="bold" text-anchor="middle">TeamVault (E2EE)</text>
    </g>
  </g>

  <!-- External Systems (Right) -->
  <g transform="translate(638, 200)">
    <rect width="214" height="212" rx="6" fill="#000000" stroke="#27272a" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="16" y="22" font-size="11" font-weight="600" fill="#52525b" class="mono">EXTERNAL INTEGRATIONS</text>

    <g transform="translate(16, 36)" class="mono">
      <rect width="182" height="32" rx="4" fill="#121215" stroke="#27272a" stroke-width="1"/>
      <text x="91" y="20" font-size="10" fill="#d4d4d8" text-anchor="middle">libssh2 / system SSH</text>

      <rect y="42" width="182" height="32" rx="4" fill="#121215" stroke="#27272a" stroke-width="1"/>
      <text x="91" y="62" font-size="10" fill="#d4d4d8" text-anchor="middle">Bastions (ProxyJump)</text>

      <rect y="84" width="182" height="32" rx="4" fill="#121215" stroke="#27272a" stroke-width="1"/>
      <text x="91" y="104" font-size="10" fill="#d4d4d8" text-anchor="middle">Kerberos (kinit / klist)</text>

      <rect y="126" width="182" height="32" rx="4" fill="#121215" stroke="#27272a" stroke-width="1"/>
      <text x="91" y="146" font-size="10" fill="#10b981" text-anchor="middle">bssh-cloud Vault API</text>
    </g>
  </g>

  <!-- Connector to External -->
  <line x1="618" y1="244" x2="636" y2="244" stroke="#52525b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowMuted)"/>

  <!-- Vector Down -->
  <line x1="333" y1="288" x2="333" y2="322" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- 3. BAYESIAN PREDICTIVE ENGINE & PERSISTENCE -->
  <g transform="translate(48, 324)">
    <rect width="570" height="88" rx="6" fill="#111113" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="22" font-size="11" font-weight="600" fill="#71717a" class="mono">03 / BAYESIAN INFERENCE &amp; STORAGE</text>

    <g transform="translate(16, 34)" class="mono">
      <rect width="170" height="36" rx="4" fill="#18181b" stroke="#3b82f6" stroke-width="1"/>
      <text x="85" y="22" font-size="11" fill="#3b82f6" font-weight="bold" text-anchor="middle">BayesianRanker P(H|E)</text>

      <rect x="180" width="170" height="36" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="265" y="22" font-size="11" fill="#f4f4f5" text-anchor="middle">FuzzySearchMatcher</text>

      <rect x="360" width="178" height="36" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="449" y="22" font-size="11" fill="#a1a1aa" text-anchor="middle">SQLite WAL Store</text>
    </g>
  </g>

  <!-- Vector Down -->
  <line x1="333" y1="412" x2="333" y2="442" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- 4. DATA DOMAIN ENTITIES -->
  <g transform="translate(48, 444)">
    <rect width="804" height="76" rx="6" fill="#0c0d10" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="20" font-size="10" font-weight="600" fill="#52525b" class="mono">04 / DOMAIN MODELS &amp; DATA STRUCTURES</text>

    <g transform="translate(16, 32)" class="mono">
      <rect width="120" height="28" rx="3" fill="#141416" stroke="#27272a" stroke-width="1"/>
      <text x="60" y="18" font-size="10" fill="#a1a1aa" text-anchor="middle">ConnectionHost</text>

      <rect x="130" width="120" height="28" rx="3" fill="#141416" stroke="#27272a" stroke-width="1"/>
      <text x="190" y="18" font-size="10" fill="#a1a1aa" text-anchor="middle">SessionHistory</text>

      <rect x="260" width="120" height="28" rx="3" fill="#141416" stroke="#27272a" stroke-width="1"/>
      <text x="320" y="18" font-size="10" fill="#a1a1aa" text-anchor="middle">HostAliasTag</text>

      <rect x="390" width="120" height="28" rx="3" fill="#141416" stroke="#27272a" stroke-width="1"/>
      <text x="450" y="18" font-size="10" fill="#a1a1aa" text-anchor="middle">ProfileConfig</text>

      <rect x="520" width="120" height="28" rx="3" fill="#141416" stroke="#27272a" stroke-width="1"/>
      <text x="580" y="18" font-size="10" fill="#a1a1aa" text-anchor="middle">AuditSignature</text>

      <rect x="650" width="122" height="28" rx="3" fill="#141416" stroke="#27272a" stroke-width="1"/>
      <text x="711" y="18" font-size="10" fill="#a1a1aa" text-anchor="middle">VaultSecret</text>
    </g>
  </g>
</svg>