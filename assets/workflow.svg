<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Clean matte background -->
  <rect width="880" height="340" fill="#09090b"/>
  <rect x="0.5" y="0.5" width="879" height="339" fill="none" stroke="#27272a" stroke-width="1"/>

  <defs>
    <marker id="wfArrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M 1 1 L 6 3.5 L 1 6 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Header -->
  <g transform="translate(44, 32)">
    <text x="0" y="14" font-size="11" font-weight="600" fill="#71717a" class="mono" letter-spacing="0.15em">BAYESIAN SSH</text>
    <text x="0" y="36" font-size="18" font-weight="600" fill="#fafafa" class="sans">Connection Pipeline &amp; Telemetry Loop</text>
  </g>

  <!-- Pipeline Steps (Top Row) -->
  <g transform="translate(44, 84)" class="mono">
    <!-- Step 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="94" rx="6" fill="#111113" stroke="#27272a" stroke-width="1"/>
      <text x="14" y="22" font-size="10" font-weight="600" fill="#71717a">01 / INPUT QUERY</text>
      <rect x="12" y="32" width="146" height="48" rx="4" fill="#000000" stroke="#27272a" stroke-width="1"/>
      <text x="20" y="52" font-size="10" fill="#71717a">$ bssh connect</text>
      <text x="20" y="69" font-size="12" font-weight="bold" fill="#f4f4f5">"prod"</text>
    </g>

    <line x1="178" y1="47" x2="200" y2="47" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#wfArrow)"/>

    <!-- Step 2 -->
    <g transform="translate(208, 0)">
      <rect width="170" height="94" rx="6" fill="#111113" stroke="#3b82f6" stroke-width="1"/>
      <text x="14" y="22" font-size="10" font-weight="600" fill="#3b82f6">02 / BAYESIAN RANK</text>
      <rect x="12" y="32" width="146" height="48" rx="4" fill="#000000" stroke="#27272a" stroke-width="1"/>
      <text x="20" y="51" font-size="10" fill="#3b82f6">0.98  web-prod-01</text>
      <text x="20" y="68" font-size="10" fill="#71717a">0.84  web-prod-02</text>
    </g>

    <line x1="386" y1="47" x2="408" y2="47" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#wfArrow)"/>

    <!-- Step 3 -->
    <g transform="translate(416, 0)">
      <rect width="170" height="94" rx="6" fill="#111113" stroke="#27272a" stroke-width="1"/>
      <text x="14" y="22" font-size="10" font-weight="600" fill="#71717a">03 / AUTO-SELECT</text>
      <rect x="12" y="32" width="146" height="48" rx="4" fill="#000000" stroke="#27272a" stroke-width="1"/>
      <text x="20" y="52" font-size="11" font-weight="bold" fill="#f4f4f5">▶ web-prod-01</text>
      <text x="20" y="68" font-size="9" fill="#10b981">High confidence</text>
    </g>

    <line x1="594" y1="47" x2="616" y2="47" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#wfArrow)"/>

    <!-- Step 4 -->
    <g transform="translate(624, 0)">
      <rect width="168" height="94" rx="6" fill="#111113" stroke="#27272a" stroke-width="1"/>
      <text x="14" y="22" font-size="10" font-weight="600" fill="#71717a">04 / TUNNEL TRANSIT</text>
      <rect x="12" y="32" width="144" height="48" rx="4" fill="#000000" stroke="#27272a" stroke-width="1"/>
      <text x="20" y="51" font-size="9.5" fill="#a1a1aa">via Bastion-01</text>
      <text x="20" y="68" font-size="9.5" fill="#a1a1aa">Kerberos verified</text>
    </g>
  </g>

  <!-- Telemetry Loop (Bottom Box) -->
  <g transform="translate(44, 202)" class="mono">
    <rect width="792" height="104" rx="6" fill="#0c0d10" stroke="#27272a" stroke-width="1"/>
    <text x="16" y="22" font-size="10" font-weight="600" fill="#52525b">CONTINUOUS BAYESIAN RE-ESTIMATION</text>

    <g transform="translate(16, 36)">
      <!-- Session Start -->
      <rect width="160" height="52" rx="4" fill="#141416" stroke="#27272a" stroke-width="1"/>
      <text x="14" y="22" font-size="10" fill="#d4d4d8">Session Spawned</text>
      <text x="14" y="40" font-size="9" fill="#71717a">PTY attached · PID saved</text>

      <line x1="166" y1="26" x2="194" y2="26" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#wfArrow)"/>

      <!-- Session Active -->
      <rect x="200" width="160" height="52" rx="4" fill="#141416" stroke="#27272a" stroke-width="1"/>
      <text x="214" y="22" font-size="10" fill="#10b981">Live Interactive</text>
      <text x="214" y="40" font-size="9" fill="#71717a">SFTP / Port forward</text>

      <line x1="366" y1="26" x2="394" y2="26" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#wfArrow)"/>

      <!-- Session End -->
      <rect x="400" width="160" height="52" rx="4" fill="#141416" stroke="#27272a" stroke-width="1"/>
      <text x="414" y="22" font-size="10" fill="#d4d4d8">Session Closed</text>
      <text x="414" y="40" font-size="9" fill="#71717a">Duration logged · Exit 0</text>

      <line x1="566" y1="26" x2="594" y2="26" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#wfArrow)"/>

      <!-- Bayesian Prior Update -->
      <rect x="600" width="160" height="52" rx="4" fill="#18181b" stroke="#3b82f6" stroke-width="1"/>
      <text x="614" y="22" font-size="10" font-weight="bold" fill="#3b82f6">Prior Recalibrated</text>
      <text x="614" y="40" font-size="9" fill="#a1a1aa">P(Host) updated in WAL</text>
    </g>
  </g>
</svg>