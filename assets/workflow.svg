<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d172a"/>
      <stop offset="100%" stop-color="#070b16"/>
    </linearGradient>

    <pattern id="wfGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.75" fill="#38bdf8" fill-opacity="0.08"/>
    </pattern>

    <marker id="wfArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <style>
    .sans {{ font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }}
    .mono {{ font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; }}
  </style>

  <!-- Background -->
  <rect width="880" height="380" rx="16" fill="url(#wfBg)"/>
  <rect width="880" height="380" rx="16" fill="url(#wfGrid)"/>
  <rect width="880" height="380" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(40, 36)">
    <circle cx="10" cy="10" r="4" fill="#38bdf8"/>
    <text x="24" y="15" font-size="18" font-weight="800" fill="#f8fafc" class="sans">BAYESIAN CONNECTION WORKFLOW</text>
    <text x="800" y="15" font-size="11" fill="#64748b" class="mono" text-anchor="end">Continuous Probability Feedback Loop</text>
  </g>

  <!-- STEP 1: CLI / Query Input -->
  <g transform="translate(40, 72)">
    <rect width="170" height="105" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.4"/>
    <text x="16" y="24" font-size="11" font-weight="700" fill="#94a3b8" class="sans">1. INPUT QUERY</text>
    <rect x="14" y="36" width="142" height="52" rx="6" fill="#050811" stroke="#1e3a8a" stroke-width="1"/>
    <text x="22" y="58" font-size="10" fill="#38bdf8" class="mono">$ bssh connect</text>
    <text x="22" y="75" font-size="13" font-weight="bold" fill="#ffffff" class="mono">"prod"</text>
  </g>

  <line x1="214" y1="124" x2="246" y2="124" stroke="#38bdf8" stroke-width="2" marker-end="url(#wfArrow)"/>

  <!-- STEP 2: Bayesian Inference Engine -->
  <g transform="translate(250, 72)">
    <rect width="175" height="105" rx="10" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.4"/>
    <text x="16" y="24" font-size="11" font-weight="700" fill="#38bdf8" class="sans">2. BAYESIAN RANKING</text>
    <rect x="14" y="36" width="147" height="52" rx="6" fill="#050811" stroke="#1e293b" stroke-width="1"/>
    <text x="22" y="55" font-size="10" fill="#38bdf8" class="mono">[0.98] web-prod-01</text>
    <text x="22" y="73" font-size="9" fill="#64748b" class="mono">[0.84] web-prod-02</text>
  </g>

  <line x1="429" y1="124" x2="461" y2="124" stroke="#38bdf8" stroke-width="2" marker-end="url(#wfArrow)"/>

  <!-- STEP 3: Auto-Route & Selection -->
  <g transform="translate(465, 72)">
    <rect width="175" height="105" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.4"/>
    <text x="16" y="24" font-size="11" font-weight="700" fill="#94a3b8" class="sans">3. SELECTION / AUTO</text>
    <rect x="14" y="36" width="147" height="52" rx="6" fill="#050811" stroke="#1e293b" stroke-width="1"/>
    <text x="22" y="55" font-size="10" font-weight="bold" fill="#ffffff" class="mono">▶ web-prod-01</text>
    <text x="22" y="73" font-size="9" fill="#10b981" class="mono">High Confidence</text>
  </g>

  <line x1="644" y1="124" x2="676" y2="124" stroke="#38bdf8" stroke-width="2" marker-end="url(#wfArrow)"/>

  <!-- STEP 4: Secure Tunnel Transit -->
  <g transform="translate(680, 72)">
    <rect width="160" height="105" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.4"/>
    <text x="16" y="24" font-size="11" font-weight="700" fill="#10b981" class="sans">4. ESTABLISH TUNNEL</text>
    <rect x="14" y="36" width="132" height="52" rx="6" fill="#050811" stroke="#1e293b" stroke-width="1"/>
    <text x="22" y="55" font-size="9.5" fill="#94a3b8" class="mono">🔗 via Bastion-01</text>
    <text x="22" y="73" font-size="9.5" fill="#94a3b8" class="mono">🔐 Kerberos verified</text>
  </g>

  <!-- FEEDBACK LOOP SECTION (BOTTOM) -->
  <g transform="translate(40, 205)">
    <rect width="800" height="135" rx="10" fill="#060a14" stroke="#1e293b" stroke-width="1.2"/>
    <text x="24" y="26" font-size="12" font-weight="700" fill="#38bdf8" class="sans">CONTINUOUS BAYESIAN LEARNING &amp; SESSION TELEMETRY</text>

    <!-- Feedback steps -->
    <g transform="translate(24, 42)" class="mono">
      <!-- Session Started -->
      <g transform="translate(0, 0)">
        <rect width="160" height="62" rx="6" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="24" font-size="11" fill="#38bdf8">Session Spawning</text>
        <text x="16" y="44" font-size="9.5" fill="#64748b">PTY bound · PID saved</text>
      </g>

      <line x1="166" y1="31" x2="194" y2="31" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#wfArrow)"/>

      <!-- Session Active -->
      <g transform="translate(198, 0)">
        <rect width="160" height="62" rx="6" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="24" font-size="11" fill="#10b981">Live Interactive ●</text>
        <text x="16" y="44" font-size="9.5" fill="#64748b">SFTP / Port Fwd ready</text>
      </g>

      <line x1="364" y1="31" x2="392" y2="31" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#wfArrow)"/>

      <!-- Session Terminated & Signed -->
      <g transform="translate(396, 0)">
        <rect width="160" height="62" rx="6" fill="#0b1220" stroke="#1e293b" stroke-width="1"/>
        <text x="16" y="24" font-size="11" fill="#cbd5e1">Session Completed</text>
        <text x="16" y="44" font-size="9.5" fill="#64748b">Duration logged · Exit 0</text>
      </g>

      <line x1="562" y1="31" x2="590" y2="31" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#wfArrow)"/>

      <!-- Bayesian Prior Updated -->
      <g transform="translate(594, 0)">
        <rect width="158" height="62" rx="6" fill="#0d1a33" stroke="#0284c7" stroke-width="1.2"/>
        <text x="16" y="24" font-size="11" font-weight="bold" fill="#38bdf8">Prior Updated 📈</text>
        <text x="16" y="44" font-size="9.5" fill="#94a3b8">P(Host) recalibrated</text>
      </g>
    </g>
  </g>
</svg>