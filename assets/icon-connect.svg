<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-conn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="cyan-blue-conn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg-conn)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#cyan-blue-conn)" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Left: Client Terminal Node -->
  <rect x="8" y="20" width="16" height="24" rx="4" fill="#091122" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 12 28 L 16 32 L 12 36" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right: Remote Server Rack -->
  <rect x="40" y="16" width="16" height="32" rx="4" fill="#091122" stroke="#3b82f6" stroke-width="2"/>
  <line x1="44" y1="22" x2="52" y2="22" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="27" x2="52" y2="27" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="45" cy="38" r="1.5" fill="#10b981"/>
  <circle cx="50" cy="38" r="1.5" fill="#38bdf8"/>

  <!-- Center: Encrypted Connection Beam & Lock -->
  <line x1="24" y1="32" x2="40" y2="32" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2"/>
  <!-- Miniature Padlock -->
  <rect x="28" y="29" width="8" height="7" rx="1.5" fill="#38bdf8"/>
  <path d="M 30 29 L 30 26 C 30 24.5 34 24.5 34 26 L 34 29" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <circle cx="32" cy="32.5" r="0.8" fill="#091122"/>
</svg>