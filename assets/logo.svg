<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pure matte dark zinc frame -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="#09090b" stroke="#27272a" stroke-width="2"/>

  <!-- Mathematical Gaussian Bell Curve (Solid technical hairline) -->
  <path d="M 88 240 
           C 152 240, 192 220, 224 150 
           C 238 120, 248 110, 256 110 
           C 264 110, 274 120, 288 150 
           C 320 220, 360 240, 424 240" 
        fill="none" stroke="#3f3f46" stroke-width="3" stroke-linecap="round"/>

  <!-- Prior distribution (dashed wider curve) -->
  <path d="M 96 240 
           C 160 240, 196 215, 226 175 
           C 242 155, 250 150, 256 150 
           C 262 150, 270 155, 286 175 
           C 316 215, 352 240, 416 240" 
        fill="none" stroke="#27272a" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- Single peak point at the MAP mode (Bayesian Target Lock) -->
  <circle cx="256" cy="110" r="7" fill="#2563eb"/>

  <!-- Clean, bold geometric prompt chevron in pure white -->
  <path d="M 160 176 L 256 260 L 160 344" 
        fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Solid terminal cursor in pure brand blue (#2563eb) -->
  <rect x="286" y="330" width="66" height="18" rx="5" fill="#2563eb"/>
</svg>