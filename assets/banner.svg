<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="40%" stop-color="#0c1220"/>
      <stop offset="100%" stop-color="#06080f"/>
    </linearGradient>

    <!-- Ambient Lights -->
    <radialGradient id="glowLeft" cx="20%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#1e40af" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Accent Borders & Fills -->
    <linearGradient id="terminalBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="30%" stop-color="#2563eb" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="cyanCurve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="laserLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="20%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.05"/>
      <circle cx="32" cy="32" r="0.7" fill="#38bdf8" fill-opacity="0.12"/>
    </pattern>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" fill="url(#cyberGrid)"/>
  <rect width="1200" height="420" fill="url(#glowLeft)"/>
  <rect width="1200" height="420" fill="url(#glowRight)"/>

  <!-- Top / Bottom Edge Precision Lines -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="url(#laserLine)" stroke-width="1.5"/>
  <line x1="0" y1="419" x2="1200" y2="419" stroke="url(#laserLine)" stroke-width="1.5"/>

  <!-- Subtle Mathematical Watermark (Bayesian Formula) -->
  <g opacity="0.04" transform="translate(80, 275)" class="font-mono">
    <text x="0" y="0" font-size="28" fill="#38bdf8" font-weight="bold">P(H | E) = P(E | H) · P(H) / P(E)   [Gaussian Decay: e^(-Δt/τ)]</text>
  </g>

  <!-- ==================== LEFT COLUMN: BRAND & HERO ==================== -->
  <g transform="translate(60, 46)">
    <!-- Category Pill -->
    <g transform="translate(0, 0)">
      <rect width="270" height="28" rx="14" fill="#0b1329" stroke="#1e3a8a" stroke-width="1.2"/>
      <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
      <text x="26" y="18" font-size="11" font-weight="600" fill="#7dd3fc" class="font-sans" letter-spacing="0.08em">INTELLIGENT SSH MANAGER</text>
    </g>

    <!-- Brand Header Group: Logo Emblem + Title -->
    <g transform="translate(0, 44)">
      <!-- Mini Brand Squircle Emblem (72x72) -->
      <g transform="translate(0, 2)">
        <rect width="72" height="72" rx="18" fill="#080c16" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.75"/>
        <rect x="3" y="3" width="66" height="66" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        
        <!-- Bell curve in emblem -->
        <path d="M 8.0 53.4 L 9.4 53.2 L 10.8 52.8 L 12.2 52.4 L 13.6 51.7 L 15.0 50.9 L 16.4 49.9 L 17.8 48.7 L 19.2 47.2 L 20.6 45.4 L 22.0 43.5 L 23.4 41.3 L 24.8 39.0 L 26.2 36.7 L 27.6 34.3 L 29.0 32.1 L 30.4 30.1 L 31.8 28.4 L 33.2 27.1 L 34.6 26.3 L 36.0 26.0 L 37.4 26.3 L 38.8 27.1 L 40.2 28.4 L 41.6 30.1 L 43.0 32.1 L 44.4 34.3 L 45.8 36.7 L 47.2 39.0 L 48.6 41.3 L 50.0 43.5 L 51.4 45.4 L 52.8 47.2 L 54.2 48.7 L 55.6 49.9 L 57.0 50.9 L 58.4 51.7 L 59.8 52.4 L 61.2 52.8 L 62.6 53.2 L 64.0 53.4 L 64 54 L 8 54 Z" fill="#38bdf8" fill-opacity="0.22"/>
        <path d="M 8.0 53.4 L 9.4 53.2 L 10.8 52.8 L 12.2 52.4 L 13.6 51.7 L 15.0 50.9 L 16.4 49.9 L 17.8 48.7 L 19.2 47.2 L 20.6 45.4 L 22.0 43.5 L 23.4 41.3 L 24.8 39.0 L 26.2 36.7 L 27.6 34.3 L 29.0 32.1 L 30.4 30.1 L 31.8 28.4 L 33.2 27.1 L 34.6 26.3 L 36.0 26.0 L 37.4 26.3 L 38.8 27.1 L 40.2 28.4 L 41.6 30.1 L 43.0 32.1 L 44.4 34.3 L 45.8 36.7 L 47.2 39.0 L 48.6 41.3 L 50.0 43.5 L 51.4 45.4 L 52.8 47.2 L 54.2 48.7 L 55.6 49.9 L 57.0 50.9 L 58.4 51.7 L 59.8 52.4 L 61.2 52.8 L 62.6 53.2 L 64.0 53.4" fill="none" stroke="url(#cyanCurve)" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="36" cy="26" r="3.5" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
        
        <!-- Prompt chevron '>' and cursor '_' in emblem -->
        <path d="M 24 35 L 34 43 L 24 51" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="38" y="47" width="12" height="3.5" rx="1.5" fill="#38bdf8"/>
      </g>

      <!-- Title Text -->
      <text x="88" y="46" font-size="42" font-weight="800" fill="url(#titleGrad)" class="font-sans" letter-spacing="-0.02em">BAYESIAN SSH</text>
      <!-- Subtitle badge -->
      <rect x="410" y="20" width="62" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="441" y="36" font-size="12" font-weight="700" fill="#38bdf8" class="font-mono" text-anchor="middle">bssh</text>
    </g>

    <!-- Hero Tagline -->
    <text x="0" y="156" font-size="20" font-weight="600" fill="#e2e8f0" class="font-sans">Every host, one keystroke away.</text>
    
    <!-- Hero Description -->
    <text x="0" y="186" font-size="14" font-weight="400" fill="#94a3b8" class="font-sans">Predictive host search powered by Bayesian inference.</text>
    <text x="0" y="208" font-size="14" font-weight="400" fill="#94a3b8" class="font-sans">Jump bastions, Kerberos, native TUI &amp; E2EE team vaults.</text>

    <!-- Key Technical Badges -->
    <g transform="translate(0, 240)">
      <!-- Badge 1: Bayesian Search -->
      <g transform="translate(0, 0)">
        <rect width="138" height="30" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="19" font-size="11" font-weight="600" fill="#38bdf8" class="font-mono">⚡ Bayesian Rank</text>
      </g>

      <!-- Badge 2: Bastions -->
      <g transform="translate(146, 0)">
        <rect width="144" height="30" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="19" font-size="11" font-weight="600" fill="#e2e8f0" class="font-mono">🛡️ Bastion &amp; Krb</text>
      </g>

      <!-- Badge 3: E2EE Team Vault -->
      <g transform="translate(298, 0)">
        <rect width="126" height="30" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="19" font-size="11" font-weight="600" fill="#a5b4fc" class="font-mono">🔒 E2EE Vault</text>
      </g>

      <!-- Badge 4: Rust Engine -->
      <g transform="translate(432, 0)">
        <rect width="74" height="30" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="19" font-size="11" font-weight="600" fill="#f97316" class="font-mono">🦀 Rust</text>
      </g>
    </g>

    <!-- Terminal Quick-install Command Box -->
    <g transform="translate(0, 288)">
      <rect width="478" height="36" rx="8" fill="#050811" stroke="#1e293b" stroke-width="1.2"/>
      <text x="14" y="23" font-size="13" fill="#38bdf8" font-weight="600" class="font-mono">$</text>
      <text x="32" y="23" font-size="12" fill="#f1f5f9" class="font-mono">curl -fsSL https://bssh.abdoufermat.dev/install.sh | bash</text>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: PRODUCT SHOWCASE TERMINAL ==================== -->
  <g transform="translate(590, 42)" filter="url(#cardShadow)">
    <!-- Double-bezel Outer Shell -->
    <rect width="550" height="336" rx="14" fill="#0a0f1d" stroke="url(#terminalBorder)" stroke-width="1.8"/>
    <rect x="3" y="3" width="544" height="330" rx="11" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

    <!-- Terminal Window Header -->
    <path d="M 3 14 C 3 7.9 7.9 3 14 3 L 536 3 C 542.1 3 547 7.9 547 14 L 547 38 L 3 38 Z" fill="#070b14"/>
    <line x1="3" y1="38" x2="547" y2="38" stroke="#1e293b" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="22" cy="20" r="5.5" fill="#f43f5e"/>
    <circle cx="38" cy="20" r="5.5" fill="#f59e0b"/>
    <circle cx="54" cy="20" r="5.5" fill="#10b981"/>

    <!-- Header Title -->
    <text x="275" y="24" font-size="11" font-weight="600" fill="#64748b" class="font-mono" text-anchor="middle">bssh — session manager — prod-cluster</text>
    <!-- Sync indicator -->
    <circle cx="510" cy="20" r="3.5" fill="#10b981"/>
    <text x="498" y="24" font-size="10" fill="#10b981" class="font-mono" text-anchor="end">E2EE synced</text>

    <!-- Terminal Body Content -->
    <!-- Input prompt -->
    <g transform="translate(20, 56)" class="font-mono">
      <text x="0" y="16" font-size="13" fill="#38bdf8" font-weight="bold">~/infra</text>
      <text x="60" y="16" font-size="13" fill="#94a3b8">$</text>
      <text x="78" y="16" font-size="13" fill="#ffffff" font-weight="600">bssh connect prod</text>
      <!-- Blinking block cursor -->
      <rect x="230" y="4" width="8" height="15" fill="#38bdf8" opacity="0.9"/>
    </g>

    <!-- Result List Container -->
    <g transform="translate(16, 88)" class="font-mono">
      <!-- Row 1 (Active Match - Rank 0.98) -->
      <g transform="translate(0, 0)">
        <!-- Highlighted row box -->
        <rect width="518" height="62" rx="6" fill="#0f1c35" stroke="#2563eb" stroke-width="1.2"/>
        <!-- Active indicator rail -->
        <path d="M 0 6 C 0 2.7 2.7 0 6 0 L 8 0 L 8 62 L 6 62 C 2.7 62 0 59.3 0 56 Z" fill="#38bdf8"/>

        <!-- Probability score badge -->
        <rect x="18" y="10" width="46" height="20" rx="4" fill="#0284c7" fill-opacity="0.3" stroke="#0284c7" stroke-width="1"/>
        <text x="41" y="24" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">0.98</text>

        <!-- Host Title -->
        <text x="72" y="24" font-size="13" font-weight="700" fill="#ffffff">web-prod-01.us-east.aws</text>
        <circle cx="278" cy="20" r="3" fill="#10b981"/>

        <!-- Tags -->
        <rect x="390" y="11" width="48" height="17" rx="3" fill="#1e293b"/>
        <text x="414" y="23" font-size="9" fill="#94a3b8" text-anchor="middle">prod</text>

        <rect x="444" y="11" width="64" height="17" rx="3" fill="#1e293b"/>
        <text x="476" y="23" font-size="9" fill="#38bdf8" text-anchor="middle">bastion-01</text>

        <!-- Metadata row -->
        <text x="18" y="48" font-size="11" fill="#94a3b8">deploy@10.0.4.12 · 142 logins · 2m ago · 24ms latency</text>
      </g>

      <!-- Row 2 (Rank 0.84) -->
      <g transform="translate(0, 68)">
        <rect width="518" height="52" rx="6" fill="#070b14" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>

        <!-- Score -->
        <rect x="18" y="8" width="46" height="18" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="41" y="21" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">0.84</text>

        <text x="72" y="22" font-size="12" font-weight="600" fill="#cbd5e1">web-prod-02.us-east.aws</text>

        <rect x="456" y="9" width="52" height="17" rx="3" fill="#1e293b"/>
        <text x="482" y="21" font-size="9" fill="#94a3b8" text-anchor="middle">prod</text>

        <text x="18" y="41" font-size="10.5" fill="#64748b">deploy@10.0.4.13 · 88 logins · 1h ago · direct</text>
      </g>

      <!-- Row 3 (Rank 0.42) -->
      <g transform="translate(0, 126)">
        <rect width="518" height="52" rx="6" fill="#070b14" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6"/>

        <!-- Score -->
        <rect x="18" y="8" width="46" height="18" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="41" y="21" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">0.42</text>

        <text x="72" y="22" font-size="12" font-weight="600" fill="#94a3b8">db-prod-replica.internal</text>

        <rect x="440" y="9" width="68" height="17" rx="3" fill="#1e293b"/>
        <text x="474" y="21" font-size="9" fill="#f59e0b" text-anchor="middle">jump-bastion</text>

        <text x="18" y="41" font-size="10.5" fill="#475569">dba@10.0.12.5 · 31 logins · 2d ago · Kerberos</text>
      </g>
    </g>

    <!-- Terminal Footer Keybinds Bar -->
    <g transform="translate(16, 296)" class="font-mono">
      <line x1="0" y1="0" x2="518" y2="0" stroke="#1e293b" stroke-width="1"/>
      <text x="6" y="20" font-size="10" fill="#38bdf8">[⏎] Connect</text>
      <text x="110" y="20" font-size="10" fill="#64748b">[Tab] SFTP</text>
      <text x="204" y="20" font-size="10" fill="#64748b">[Ctrl+T] Terminal</text>
      <text x="336" y="20" font-size="10" fill="#64748b">[Ctrl+K] Palette</text>
      <text x="468" y="20" font-size="10" fill="#64748b">[?] Help</text>
    </g>
  </g>
</svg>