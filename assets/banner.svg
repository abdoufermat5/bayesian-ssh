<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Bayesian SSH: every host, one keystroke away">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="14" fill="#111113" stroke="#26262b"/>

  <!-- Mark and name -->
  <g transform="translate(64 56) scale(0.0703)">
    <rect x="16" y="16" width="480" height="480" rx="112" fill="#1b1b1f"/>
    <path d="M136 168 L232 256 L136 344" fill="none" stroke="#ffffff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="280" y="168" width="96" height="176" rx="14" fill="#5b8def"/>
  </g>
  <text x="112" y="82" class="sans" font-size="17" font-weight="600" fill="#e6e6e9">Bayesian SSH</text>

  <!-- Headline -->
  <text class="sans" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
    <tspan x="64" y="138">Every host,</tspan>
    <tspan x="64" y="184">one keystroke away.</tspan>
  </text>
  <text class="sans" font-size="16" fill="#a1a1aa">
    <tspan x="64" y="220">An SSH session manager for the terminal and the desktop:</tspan>
    <tspan x="64" y="243">search ranked by how you work, bastions and Kerberos,</tspan>
    <tspan x="64" y="266">and end-to-end encrypted sharing with your team.</tspan>
  </text>

  <!-- Install -->
  <rect x="64" y="290" width="492" height="38" rx="8" fill="#18181b" stroke="#2c2c33"/>
  <text x="80" y="314" class="mono" font-size="13" fill="#e6e6e9"><tspan fill="#5b8def">$</tspan> curl -fsSL https://bssh.abdoufermat.dev/install.sh | bash</text>

  <!-- Terminal -->
  <g transform="translate(604 40)">
    <rect x="0" y="0" width="556" height="280" rx="10" fill="#0b0b0d" stroke="#2c2c33"/>
    <path d="M0 10 a10 10 0 0 1 10 -10 h536 a10 10 0 0 1 10 10 v24 h-556 z" fill="#18181b"/>
    <circle cx="20" cy="17" r="5" fill="#3f3f46"/><circle cx="38" cy="17" r="5" fill="#3f3f46"/><circle cx="56" cy="17" r="5" fill="#3f3f46"/>
    <text x="278" y="22" text-anchor="middle" class="mono" font-size="12" fill="#71717a">~/work</text>
    <g class="mono" font-size="13.5" fill="#d4d4d8">
      <text x="20" y="62"><tspan fill="#5b8def">$</tspan> bssh connect prod</text>
      <text x="20" y="88" fill="#a1a1aa">Found 3 similar connections for 'prod':</text>
      <text x="36" y="116"><tspan fill="#71717a">1.</tspan> <tspan fill="#ffffff">web-prod-1</tspan> <tspan fill="#71717a">(web-prod-1.eu-west.internal)</tspan></text>
      <text x="60" y="135" fill="#71717a">Tags: prod, web (last used: 2 minutes ago)</text>
      <text x="36" y="161"><tspan fill="#71717a">2.</tspan> <tspan fill="#ffffff">web-prod-2</tspan> <tspan fill="#71717a">(web-prod-2.eu-west.internal)</tspan></text>
      <text x="60" y="180" fill="#71717a">Tags: prod, web (last used: 3 hours ago)</text>
      <text x="36" y="206"><tspan fill="#71717a">3.</tspan> <tspan fill="#ffffff">db-prod</tspan> <tspan fill="#71717a">(db-prod.internal, via bastion)</tspan></text>
      <text x="60" y="225" fill="#71717a">Tags: prod, db (last used: 2 days ago)</text>
      <text x="20" y="256">Select connection to connect [1-3, 's', 'q']: <tspan fill="#ffffff">1</tspan><tspan fill="#5b8def">█</tspan></text>
    </g>
  </g>
</svg>
