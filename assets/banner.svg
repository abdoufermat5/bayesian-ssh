<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Clean matte background -->
  <rect width="1200" height="300" fill="#09090b"/>
  <rect x="0.5" y="0.5" width="1199" height="299" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- ==================== LEFT COLUMN: TYPOGRAPHY & HERO ==================== -->
  <g transform="translate(56, 42)">
    <!-- Category Label -->
    <text x="0" y="14" font-size="11" font-weight="600" fill="#71717a" class="mono" letter-spacing="0.15em">BAYESIAN SSH</text>

    <!-- Main Title Headline -->
    <text x="0" y="58" font-size="32" font-weight="600" fill="#fafafa" class="sans" letter-spacing="-0.025em">Every host, one keystroke away.</text>

    <!-- Subtitle -->
    <text x="0" y="94" font-size="14" fill="#a1a1aa" class="sans">Intelligent SSH session manager for terminal and desktop.</text>
    <text x="0" y="116" font-size="14" fill="#a1a1aa" class="sans">Ranks connections by Bayesian inference. Built-in bastions,</text>
    <text x="0" y="138" font-size="14" fill="#a1a1aa" class="sans">Kerberos tickets, and end-to-end encrypted team vaults.</text>

    <!-- Feature tags: minimal hairline text -->
    <g transform="translate(0, 168)" class="mono">
      <text x="0" y="12" font-size="11" fill="#3b82f6">01</text>
      <text x="20" y="12" font-size="11" fill="#d4d4d8">Predictive ranking</text>
      
      <text x="164" y="12" font-size="11" fill="#71717a">/</text>
      <text x="180" y="12" font-size="11" fill="#3b82f6">02</text>
      <text x="200" y="12" font-size="11" fill="#d4d4d8">Bastions &amp; Kerberos</text>

      <text x="360" y="12" font-size="11" fill="#71717a">/</text>
      <text x="376" y="12" font-size="11" fill="#3b82f6">03</text>
      <text x="396" y="12" font-size="11" fill="#d4d4d8">E2EE Team Vault</text>
    </g>

    <!-- Install command box -->
    <g transform="translate(0, 202)" class="mono">
      <rect width="480" height="38" rx="6" fill="#121215" stroke="#27272a" stroke-width="1"/>
      <text x="14" y="24" font-size="12" fill="#71717a">$</text>
      <text x="30" y="24" font-size="12" fill="#f4f4f5">curl -fsSL https://bssh.abdoufermat.dev/install.sh | bash</text>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: AUTHENTIC MINIMAL TERMINAL ==================== -->
  <g transform="translate(590, 36)">
    <!-- Terminal window container -->
    <rect width="554" height="228" rx="8" fill="#000000" stroke="#27272a" stroke-width="1"/>

    <!-- Window header bar -->
    <rect width="554" height="32" rx="8" fill="#0c0d10"/>
    <rect y="24" width="554" height="8" fill="#0c0d10"/>
    <line x1="0" y1="32" x2="554" y2="32" stroke="#1c1c1f" stroke-width="1"/>

    <!-- Muted window dots -->
    <circle cx="18" cy="16" r="4" fill="#27272a"/>
    <circle cx="32" cy="16" r="4" fill="#27272a"/>
    <circle cx="46" cy="16" r="4" fill="#27272a"/>

    <text x="277" y="20" font-size="11" fill="#71717a" class="mono" text-anchor="middle">bssh — session manager</text>

    <!-- Terminal Content -->
    <g transform="translate(18, 52)" class="mono">
      <!-- Prompt -->
      <text x="0" y="14" font-size="12" fill="#71717a">$</text>
      <text x="16" y="14" font-size="12" fill="#f4f4f5">bssh connect prod</text>
      <rect x="160" y="3" width="7" height="14" fill="#3b82f6"/>

      <!-- Ranked Host Results -->
      <!-- Row 1: Selected / Active -->
      <g transform="translate(0, 30)">
        <rect x="-6" y="0" width="530" height="38" rx="4" fill="#14151a"/>
        <line x1="-6" y1="0" x2="-6" y2="38" stroke="#3b82f6" stroke-width="2.5"/>
        
        <text x="6" y="24" font-size="12" fill="#3b82f6" font-weight="bold">▶</text>
        <text x="24" y="24" font-size="11" fill="#3b82f6" font-weight="bold">0.98</text>
        <text x="64" y="24" font-size="12" fill="#ffffff" font-weight="600">web-prod-01.us-east.aws</text>
        
        <text x="320" y="24" font-size="11" fill="#a1a1aa">2m ago</text>
        <text x="400" y="24" font-size="11" fill="#71717a">via bastion-01</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 76)">
        <text x="24" y="16" font-size="11" fill="#52525b">0.84</text>
        <text x="64" y="16" font-size="12" fill="#a1a1aa">web-prod-02.us-east.aws</text>
        <text x="320" y="16" font-size="11" fill="#52525b">1h ago</text>
        <text x="400" y="16" font-size="11" fill="#52525b">direct</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 102)">
        <text x="24" y="16" font-size="11" fill="#3f3f46">0.41</text>
        <text x="64" y="16" font-size="12" fill="#71717a">db-prod-replica.internal</text>
        <text x="320" y="16" font-size="11" fill="#3f3f46">2d ago</text>
        <text x="400" y="16" font-size="11" fill="#3f3f46">via bastion-01</text>
      </g>
    </g>

    <!-- Terminal Footer -->
    <g transform="translate(18, 204)" class="mono">
      <line x1="-6" y1="0" x2="524" y2="0" stroke="#1c1c1f" stroke-width="1"/>
      <text x="0" y="15" font-size="10" fill="#52525b">Enter: connect</text>
      <text x="130" y="15" font-size="10" fill="#3f3f46">Tab: actions</text>
      <text x="240" y="15" font-size="10" fill="#3f3f46">Ctrl+K: palette</text>
      <text x="380" y="15" font-size="10" fill="#3f3f46">?: help</text>
    </g>
  </g>
</svg>