<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-vault" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="cyan-blue-vault" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg-vault)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#cyan-blue-vault)" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Cryptographic Shield -->
  <path d="M 32 10 L 48 16 C 48 30 41 42 32 50 C 23 42 16 30 16 16 Z" 
        fill="#091326" stroke="url(#cyan-blue-vault)" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Vault Lock Core -->
  <circle cx="32" cy="27" r="5" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M 32 32 L 32 38" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="27" r="2" fill="#38bdf8"/>

  <!-- Synchronized Team Nodes Orbiting -->
  <circle cx="14" cy="32" r="2.5" fill="#38bdf8"/>
  <circle cx="50" cy="32" r="2.5" fill="#38bdf8"/>
</svg>