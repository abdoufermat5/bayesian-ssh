# Snap package for Bayesian SSH.
#
# This repackages the assets of a published GitHub release rather than
# rebuilding: scripts/snap-stage.sh downloads the CLI binary and the desktop
# .deb for one architecture, verifies them against SHA256SUMS, and writes this
# file with __VERSION__ replaced next to them (target/snap by default). Build
# from that directory, never from here:
#
#   scripts/snap-stage.sh v2.6.0 amd64 && cd target/snap && snapcraft pack
#
# core24 matches the release runners (ubuntu-24.04, glibc 2.39), so both
# architectures run on this base.
name: bayesian-ssh
base: core24
version: "__VERSION__"
title: Bayesian SSH
summary: Fast and lightweight SSH session manager with Bayesian-ranked search
license: MIT
contact: https://github.com/abdoufermat5/bayesian-ssh/issues
issues: https://github.com/abdoufermat5/bayesian-ssh/issues
source-code: https://github.com/abdoufermat5/bayesian-ssh
# Store listing links are set once on the dashboard (upload-metadata does not
# push them); keep these in step with snapcraft.io/bayesian-ssh/listing.
website: https://abdoufermat5.github.io/bayesian-ssh/
# Store listing icon (512x512), copied next to this file by snap-stage.sh.
icon: bayesian-ssh.png
description: |
  Bayesian SSH is a smart, high-performance SSH session manager featuring
  Bayesian-ranked search, bastion jump-host chaining, a CLI and a desktop
  application.

  Kerberos is optional. Tickets obtained from inside the app work out of the
  box. To reuse tickets created on the host (KRB5CCNAME=FILE:/tmp/krb5cc_*),
  also run:

    sudo snap connect bayesian-ssh:kerberos-tickets

  After installing, grant read access to your SSH configuration and keys:

    sudo snap connect bayesian-ssh:ssh-keys

  and optionally restore the short command name:

    sudo snap alias bayesian-ssh bssh
grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

# webkit2gtk resolves its helper binaries and libraries from a fixed system
# path; bind the staged copy there (Tauri's Snapcraft guide).
layout:
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/webkit2gtk-4.1

# `ssh-keys` and `kerberos-tickets` are not auto-connected: users connect them
# once (see the description). `ssh-keys` grants read-only access to ~/.ssh and
# /etc/ssh, so the snap cannot write ~/.ssh/known_hosts or generate keys into
# ~/.ssh. `kerberos-tickets` exposes the host's /tmp/krb5cc* caches; snap run
# rewrites KRB5CCNAME to them when it is set to FILE:/tmp/krb5cc*.
apps:
  bayesian-ssh:
    command: usr/bin/bayesian-ssh
    # `bayesian-ssh desktop` launches the GUI from this app's sandbox, so it
    # needs the same desktop environment as the `gui` app.
    extensions: [gnome]
    plugs: [home, network, network-bind, ssh-keys, kerberos-tickets]

  gui:
    command: usr/bin/bayesian-ssh-gui
    desktop: usr/share/applications/bayesian-ssh-desktop.desktop
    # The gnome extension provides GTK and the desktop interfaces, including the
    # tray (StatusNotifier) and org.freedesktop.Notifications.
    extensions: [gnome]
    plugs: [home, network, network-bind, ssh-keys, kerberos-tickets]

parts:
  cli:
    plugin: dump
    source: cli
    organize:
      bayesian-ssh: usr/bin/bayesian-ssh
    # Programs both apps spawn: ssh/ssh-keygen/ssh-add/ssh-agent, kinit/klist
    # (only used for connections that opt into Kerberos), and notify-send for
    # desktop notifications. The host's copies are not reachable from a strict
    # snap.
    stage-packages:
      - openssh-client
      - krb5-user
      - libnotify-bin
    # krb5-user ships kinit.mit/klist.mit and creates the kinit/klist names
    # through update-alternatives in its postinst, which stage-packages never
    # runs; provide the names the apps call.
    override-prime: |
      craftctl default
      ln -sf kinit.mit "$CRAFT_PRIME/usr/bin/kinit"
      ln -sf klist.mit "$CRAFT_PRIME/usr/bin/klist"

  desktop:
    plugin: dump
    source: bayesian-ssh-desktop.deb
    source-type: deb
    # The .deb's Depends:, as in Tauri's Snapcraft guide.
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
      - libayatana-appindicator3-1
    override-build: |
      craftctl default
      # The .deb ships Icon=bayesian-ssh-gui, which is not on the snap's icon
      # path; point the desktop entry at the staged icon.
      sed -i \
        -e "s|^Icon=bayesian-ssh-gui$|Icon=/usr/share/icons/hicolor/128x128/apps/bayesian-ssh-gui.png|" \
        "$CRAFT_PART_INSTALL/usr/share/applications/bayesian-ssh-desktop.desktop"
